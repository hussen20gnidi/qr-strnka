{% extends "base.html" %}

{% block content %}
<div class="card form-card">
    <h1>Vytvořit QR kód</h1>

    <form method="POST">
        <label>Název QR kódu</label>
        <input name="name" placeholder="Např. Instagram" required>

        <label>Obsah QR kódu</label>
        <input name="data" placeholder="Text nebo odkaz" required>

        <button class="btn" type="submit">Vytvořit</button>
    </form>

    <a href="/dashboard">Zpět</a>
</div>
{% endblock %}

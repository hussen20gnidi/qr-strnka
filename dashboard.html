{% extends 'base.html' %}
{% block content %}

<div class="box">
<h1>Your QR Codes</h1>
</div>

{% for qr in qrs %}
<div class="box">
<h2>{{ qr.name }}</h2>
<p>{{ qr.data }}</p>

<img src="{{ url_for('static', filename='qrcodes/' + qr.file) }}">

<br><br>

<a href="/delete/{{ qr.id }}">Delete</a>
</div>
{% endfor %}

{% endblock %}
